name: AutoBuild

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build portable EXE and installer
        shell: pwsh
        run: .\build-installer.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FitBudsControl-windows-x64
          if-no-files-found: error
          path: |
            artifacts/single-file/FitBudsControl.exe
            artifacts/installer/FitBudsControl-Setup-*.exe
            LICENSE
            THIRD_PARTY_NOTICES.txt

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(
            'artifacts/single-file/FitBudsControl.exe',
            (Get-ChildItem 'artifacts/installer/FitBudsControl-Setup-*.exe' | Select-Object -First 1 -ExpandProperty FullName)
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --generate-notes --title $tag
          }
